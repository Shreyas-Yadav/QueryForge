<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QueryForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #fafbfc; --border: #dfe1e6; --divider: #ebecf0;
    --text: #172b4d; --text-2: #42526e; --muted: #6b778c; --faint: #a5adba;
    --accent: #0052cc; --accent-soft: #deebff; --accent-text: #0747a6; --focus: #4c9aff; --on-accent: #ffffff;
    --star: #ffab00; --hot: #de350b;
    --ok-bg: #e3fcef; --ok: #006644; --warn-bg: #fff7d6; --warn: #974f0c;
    --err-bg: #ffebe6; --err: #bf2600; --err-border: #ffbdad;
    --hover: #f4f5f7; --skel: #ebecf0; --toast-bg: #172b4d; --toast-text: #ffffff;
    --shadow: 0 4px 12px rgba(9, 30, 66, .12);
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  [data-theme="dark"] {
    --bg: #0e1116; --surface: #161a21; --surface-2: #12161c; --border: #262c36; --divider: #1f242d;
    --text: #e6e9ee; --text-2: #b3bac5; --muted: #8590a0; --faint: #566070;
    --accent: #579dff; --accent-soft: #1c2b42; --accent-text: #85b8ff; --focus: #579dff; --on-accent: #0b1a33;
    --star: #f5b73b; --hot: #f87168;
    --ok-bg: #12301f; --ok: #4bce97; --warn-bg: #33290f; --warn: #e2b203;
    --err-bg: #3a1a14; --err: #fd9891; --err-border: #5d2a20;
    --hover: #1c212a; --skel: #222833; --toast-bg: #e6e9ee; --toast-text: #0e1116;
    --shadow: 0 4px 16px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: var(--sans); }
  button { cursor: pointer; }
  code, pre, .mono { font-family: var(--mono); }
  .hidden { display: none !important; }

  /* Header */
  .hdr { display: flex; align-items: center; height: 46px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 13px; position: sticky; top: 0; z-index: 20; }
  .brandbox { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 100%; border-right: 1px solid var(--divider); width: 240px; flex-shrink: 0; }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .iconbtn { width: 32px; height: 32px; border-radius: 4px; border: 0; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .iconbtn:hover { background: var(--hover); color: var(--text); }
  .kv { display: flex; gap: 22px; color: var(--muted); padding-left: 18px; min-width: 0; }
  .kv span { white-space: nowrap; }
  .kv b { color: var(--text); font-weight: 500; margin-left: 6px; font-family: var(--mono); font-size: 12.5px; }
  .hdr-right { margin-left: auto; display: flex; gap: 8px; padding-right: 12px; align-items: center; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 3px; letter-spacing: .03em; white-space: nowrap; }
  .tag.g { background: var(--ok-bg); color: var(--ok); }
  .tag.y { background: var(--warn-bg); color: var(--warn); }
  .tag.r { background: var(--err-bg); color: var(--err); cursor: help; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12.5px; }
  .linkbtn:hover { text-decoration: underline; }
  .linkbtn.done { color: var(--ok); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 4px 10px; }
  .seg button.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
  .quiet { color: var(--muted); background: none; border: 0; font-size: 13px; padding: 4px 6px; }
  .quiet:hover { color: var(--text); }

  /* Shell + sidebar */
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 46px); }
  .side { background: var(--surface); border-right: 1px solid var(--border); padding: 12px 10px; font-size: 13px; overflow: hidden auto; }

  /* Main */
  .main { padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .ask { display: flex; gap: 8px; }
  .ask .t { flex: 1; min-width: 0; background: var(--surface); border: 2px solid var(--border); border-radius: 4px; padding: 0 6px 0 12px; display: flex; align-items: center; gap: 8px; }
  .ask .t:focus-within { border-color: var(--focus); }
  .ask input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; padding: 8px 0; }
  .ask input::placeholder { color: var(--faint); }
  .ask .hint { font-family: var(--mono); font-size: 11px; color: var(--faint); border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; }
  .ask .star { color: var(--faint); font-size: 17px; background: none; border: 0; width: 32px; height: 32px; }
  .ask .star.on { color: var(--star); }
  .run { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 4px; padding: 0 16px; font-weight: 600; font-size: 13.5px; min-width: 132px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .run:disabled { opacity: .7; cursor: default; }
  .run .spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stop { background: var(--surface); color: var(--err); border: 1px solid var(--err-border); border-radius: 4px; padding: 0 12px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .stop .k { font-family: var(--mono); font-size: 11px; border: 1px solid var(--err-border); border-radius: 3px; padding: 0 4px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .pan { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; min-width: 0; }
  .ph { display: flex; align-items: center; flex-wrap: wrap; min-height: 34px; padding: 4px 12px; border-bottom: 1px solid var(--divider); font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; gap: 4px 8px; }
  .ph .r { margin-left: auto; font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .answer { padding: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--faint); }
  .notice { padding: 10px 12px; border-radius: 4px; border: 1px solid; font-size: 13.5px; white-space: normal; }
  .notice b { display: block; margin-bottom: 2px; }
  .notice.err { background: var(--err-bg); border-color: var(--err-border); }
  .notice.err b { color: var(--err); }
  .notice.warn { background: var(--warn-bg); border-color: var(--warn-bg); }
  .notice.warn b { color: var(--warn); }
  pre.sql { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; font-size: 12.5px; line-height: 1.6; background: var(--surface-2); color: var(--text); min-height: 100px; border-radius: 0 0 4px 4px; }

  /* Results */
  .trunc { padding: 7px 12px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; border-bottom: 1px solid var(--divider); }
  .tablewrap { overflow: auto; max-height: 420px; }
  table.grid { border-collapse: collapse; width: max-content; min-width: 100%; }

  /* Activity */
  details > summary { list-style: none; cursor: pointer; user-select: none; }
  details > summary::-webkit-details-marker { display: none; }
  .chev { display: inline-block; transition: transform .15s; font-size: 9px; width: 10px; color: var(--muted); }
  details[open] > summary .chev { transform: rotate(90deg); }
  .act > summary { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
  .act > summary .live { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--accent); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .act > summary .r { margin-left: auto; font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; white-space: nowrap; }
  .log { border-top: 1px solid var(--divider); padding: 8px 0; font-size: 12px; font-family: var(--mono); max-height: 320px; overflow: auto; }
  .log .line { display: grid; grid-template-columns: 64px 52px minmax(0, 1fr); gap: 10px; padding: 2px 12px; color: var(--text-2); }
  .log .line > span:last-child { overflow-wrap: anywhere; }
  .log .ts { color: var(--faint); }
  .log .k-think { color: var(--muted); font-style: italic; }
  .log .k-tool { color: var(--accent); }
  .log .k-error, .log .k-stop { color: var(--err); }

  /* Login */
  .login-wrap { display: flex; justify-content: center; padding: 56px 16px; }
  .login { width: 100%; max-width: 420px; padding: 20px; }
  .login h2 { margin: 0 0 14px; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
  #login-form { display: flex; flex-direction: column; gap: 14px; }
  #login-form label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
  #login-form select, #login-form input {
    padding: 9px 12px; background: var(--surface); color: var(--text);
    border: 2px solid var(--border); border-radius: 4px; font-size: 14px; outline: none;
  }
  #login-form select:focus, #login-form input:focus { border-color: var(--focus); }
  .login-error { color: var(--err); font-size: 13px; }
  #login-btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 4px; padding: 10px; font-weight: 600; font-size: 14px; }
  #login-btn:disabled { opacity: .6; cursor: default; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--toast-bg); color: var(--toast-text); font-size: 12.5px; padding: 7px 14px; border-radius: 4px; opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; z-index: 50; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<header class="hdr">
  <div class="brandbox">
    <button id="sidebar-toggle" class="iconbtn hidden" type="button" title="Toggle saved queries" aria-label="Toggle saved queries">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5"/><line x1="6" y1="3" x2="6" y2="13"/></svg>
    </button>
    <span class="brand">QueryForge</span>
  </div>
  <div id="session-info" class="kv hidden">
    <span><span class="lbl">Database</span><b id="db-name">…</b></span>
    <span><span class="lbl">User</span><b id="db-user">…</b></span>
  </div>
  <div class="hdr-right">
    <span id="conn" class="tag g hidden">● CONNECTED</span>
    <button id="reconnect" class="linkbtn hidden" type="button">Reconnect</button>
    <span id="ro-tag" class="tag y hidden">READ-ONLY</span>
    <div class="seg" role="group" aria-label="Theme">
      <button id="theme-light" type="button" class="on">Light</button>
      <button id="theme-dark" type="button">Dark</button>
    </div>
    <button id="logout" class="quiet hidden" type="button">Log out</button>
  </div>
</header>

<section id="login-sec" class="login-wrap hidden">
  <div class="pan login">
    <h2>Connect to a database</h2>
    <form id="login-form">
      <label>Database <select id="login-db"></select></label>
      <label>User <select id="login-user"></select></label>
      <label>Password <input id="login-pw" type="password" autocomplete="current-password" /></label>
      <div id="login-error" class="login-error hidden"></div>
      <button id="login-btn" type="submit" disabled>Connect</button>
    </form>
  </div>
</section>

<div id="app" class="shell hidden">
  <aside id="sidebar" class="side" aria-label="Saved queries"></aside>

  <main class="main">
    <form id="form" class="ask">
      <div class="t">
        <input id="q" type="text" placeholder="Ask about SQL performance, waits, plans…" autocomplete="off" aria-label="Question" />
        <span class="hint" id="khint">⌘K</span>
        <button id="star" class="star" type="button" title="Save this question" aria-label="Save this question">★</button>
      </div>
      <button id="ask" class="run" type="submit">Run</button>
      <button id="stop" class="stop hidden" type="button">Stop <span class="k">Esc</span></button>
    </form>

    <div id="panels" class="hidden">
      <div class="two">
        <section class="pan">
          <div class="ph">Answer</div>
          <div id="answer" class="answer"></div>
        </section>
        <section class="pan">
          <div class="ph">Generated SQL <span class="r"><button id="copy-sql" class="linkbtn" type="button">Copy</button></span></div>
          <pre id="sql" class="sql"></pre>
        </section>
      </div>

      <section id="result-sec" class="pan hidden" style="margin-top:12px">
        <div class="ph">Results
          <span class="r">
            <span id="result-meta"></span>
            <button id="rerun" class="linkbtn" type="button" title="Run the same question again">↻ Re-run</button>
            <button id="csv" class="linkbtn" type="button">Export CSV</button>
          </span>
        </div>
        <div id="trunc" class="trunc hidden"></div>
        <div class="tablewrap"><table id="result" class="grid"></table></div>
      </section>

      <details id="activity-sec" class="pan act" style="margin-top:12px">
        <summary><span class="chev">▶</span>Activity <span class="live" id="activity-live"></span><span class="r" id="activity-meta"></span></summary>
        <div id="activity" class="log"></div>
      </details>
    </div>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
// Pure helpers live on QF so tests can run them in Node; DOM code runs only in a browser.
const QF = {};

// --- results ---
QF.isCopyColumn = (name) => /(^|_)ID$/i.test(name) || /PLAN_HASH/i.test(name);
QF.isElapsedColumn = (name) => /^ELAPSED/i.test(name);

QF.formatCell = (value, column) => {
  if (value === null || value === undefined) return "—";
  if (QF.isCopyColumn(column)) return String(value);
  if (typeof value === "number") return value.toLocaleString("en-US", { maximumFractionDigits: 3 });
  return String(value);
};

QF.sortRows = (rows, col, dir) => [...rows].sort((a, b) => {
  const x = a[col], y = b[col];
  if (x === null || x === undefined) return (y === null || y === undefined) ? 0 : 1;
  if (y === null || y === undefined) return -1;
  const cmp = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y));
  return cmp * dir;
});

QF.toCsv = (columns, rows) => {
  const field = (v) => {
    if (v === null || v === undefined) return "";
    const s = String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [columns, ...rows].map(r => r.map(field).join(",")).join("\r\n");
};

// --- storage: per-browser conveniences; every access may throw or be missing ---
QF.store = {
  get(key, fallback) {
    try {
      const raw = globalThis.localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  },
  set(key, value) {
    try { globalThis.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
  },
};

// --- saved queries: {question, group, lastRun} ---
QF.parseBookmarks = (raw) => {
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(b => b && typeof b.question === "string" && b.question.trim() && typeof b.group === "string")
    .map(b => ({ question: b.question, group: b.group, lastRun: typeof b.lastRun === "number" ? b.lastRun : null }));
};

QF.addBookmark = (list, question, group) => {
  const q = question.trim();
  const item = { question: q, group: group.trim() || "Saved", lastRun: null };
  const i = list.findIndex(b => b.question === q);
  if (i === -1) return [...list, item];
  return list.map((b, j) => j === i ? { ...item, lastRun: b.lastRun } : b);
};

QF.removeBookmark = (list, question) => list.filter(b => b.question !== question);

QF.touchBookmark = (list, question, nowMs) =>
  list.map(b => b.question === question ? { ...b, lastRun: nowMs } : b);

QF.groupBookmarks = (list, filter) => {
  const f = filter.trim().toLowerCase();
  const groups = [];
  list.filter(b => b.question.toLowerCase().includes(f)).forEach(b => {
    let g = groups.find(x => x.group === b.group);
    if (!g) groups.push(g = { group: b.group, items: [] });
    g.items.push(b);
  });
  return groups;
};

// --- time ---
QF.relativeTime = (thenMs, nowMs) => {
  const s = (nowMs - thenMs) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " hr ago";
  if (s < 172800) return "yesterday";
  return Math.floor(s / 86400) + " days ago";
};

QF.clock = (ms) => {
  const m = Math.floor(ms / 60000), s = (ms % 60000) / 1000;
  return String(m).padStart(2, "0") + ":" + s.toFixed(1).padStart(4, "0");
};

// --- activity ---
const cut = (text, n) => text.length > n ? text.slice(0, n) + "…" : text;

QF.activityLine = (ev) => {
  switch (ev.type) {
    case "status": return { kind: "status", text: ev.message };
    case "thinking": return { kind: "think", text: cut(ev.text, 200), title: ev.text };
    case "assistant_text": return { kind: "text", text: ev.text };
    case "tool_call": return { kind: "tool", text: ev.name + "(" + cut(JSON.stringify(ev.input), 160) + ")" };
    case "result": return { kind: "tool", text: "run_query → " + ev.row_count + " row" + (ev.row_count === 1 ? "" : "s") };
    case "tool_error": return { kind: "error", text: ev.name + ": " + ev.message };
    case "error": return { kind: "error", text: ev.message };
    default: return null;
  }
};

QF.liveStep = (ev) => {
  if (ev.type === "status") return ev.message;
  if (ev.type === "tool_call") return ev.name + "…";
  if (ev.type === "thinking") return "thinking…";
  return null;
};

const $ = (id) => document.getElementById(id);

// --- login / session ---
let databases = [];

function showLoginError(msg) {
  $("login-error").textContent = msg;
  $("login-error").classList.toggle("hidden", !msg);
}

function fillUsers() {
  const entry = databases.find(d => d.name === $("login-db").value);
  $("login-user").innerHTML = "";
  (entry ? entry.users : []).forEach(u => $("login-user").add(new Option(u, u)));
}

async function loadDatabases() {
  showLoginError("");
  $("login-db").innerHTML = "";
  $("login-btn").disabled = true;
  try {
    const resp = await fetch("/databases");
    const body = await resp.json();
    if (!resp.ok) throw new Error(body.detail || "could not load databases");
    databases = body.databases;
    databases.forEach(d => $("login-db").add(
      new Option(d.name + " — " + d.host + ":" + d.port + "/" + d.service_name, d.name)));
    fillUsers();
    $("login-btn").disabled = false;
  } catch (e) {
    showLoginError(e.message);
  }
}

const SESSION_CHROME = ["app", "session-info", "conn", "ro-tag", "logout", "sidebar-toggle"];
let session = null;

function showLogin() {
  session = null;
  SESSION_CHROME.forEach(id => $(id).classList.add("hidden"));
  $("reconnect").classList.add("hidden");
  $("login-sec").classList.remove("hidden");
  loadDatabases().then(() => $("login-pw").focus());
}

function showApp(s) {
  session = s;
  $("login-sec").classList.add("hidden");
  SESSION_CHROME.forEach(id => $(id).classList.remove("hidden"));
  $("db-user").textContent = s.user;
  $("db-name").textContent = s.database;
  $("conn").className = "tag " + (s.reachable ? "g" : "r");
  $("conn").textContent = s.reachable ? "● CONNECTED" : "● DISCONNECTED";
  $("conn").title = s.reachable ? "" : (s.detail || "");
  $("q").focus();
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("theme-light").classList.toggle("on", theme === "light");
  $("theme-dark").classList.toggle("on", theme === "dark");
  QF.store.set("qf.theme", theme);
}

async function loadSession() {
  try {
    const s = await (await fetch("/session")).json();
    s.logged_in ? showApp(s) : showLogin();
  } catch (e) {
    showLogin();
  }
}

function logLine(text, cls = "") {
  const el = document.createElement("div");
  el.className = "line " + cls;
  el.textContent = text;
  $("activity").appendChild(el);
  $("activity").scrollTop = $("activity").scrollHeight;
}

function renderTable(columns, rows) {
  const t = $("result");
  t.innerHTML = "";
  const thead = t.createTHead().insertRow();
  columns.forEach(c => { const th = document.createElement("th"); th.textContent = c; thead.appendChild(th); });
  const tbody = t.createTBody();
  rows.forEach(r => {
    const tr = tbody.insertRow();
    r.forEach(v => { const td = tr.insertCell(); td.textContent = v === null ? "∅" : String(v); });
  });
}

function handleEvent(ev) {
  switch (ev.type) {
    case "status":        logLine(ev.message); break;
    case "thinking":      logLine("thinking: " + ev.text.slice(0, 200), "thinking"); break;
    case "assistant_text":logLine(ev.text); break;
    case "tool_call":     logLine("→ " + ev.name + "(" + JSON.stringify(ev.input).slice(0, 160) + ")", "tool"); break;
    case "sql":
      $("sql").textContent = ev.sql;
      break;
    case "result":
      renderTable(ev.columns, ev.rows);
      $("result-meta").textContent =
        ev.row_count + " row" + (ev.row_count === 1 ? "" : "s") + (ev.truncated ? " (truncated)" : "");
      $("result-sec").classList.remove("hidden");
      break;
    case "tool_error":    logLine("⚠ " + ev.name + ": " + ev.message, "err"); break;
    case "answer":
      $("answer").textContent = ev.text || "(no answer)";
      break;
    case "error":         logLine("error: " + ev.message, "err"); break;
  }
}

async function ask(question) {
  // reset
  $("panels").classList.remove("hidden");
  $("result-sec").classList.add("hidden");
  $("answer").textContent = "";
  $("sql").textContent = "";
  $("activity").innerHTML = "";
  $("ask").disabled = true;

  try {
    const resp = await fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (resp.status === 401) {
      showLogin();
      showLoginError("Not connected — log in again.");
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();  // keep incomplete trailer
      for (const part of parts) {
        const line = part.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "done") continue;
        handleEvent(ev);
      }
    }
  } catch (e) {
    logLine("request failed: " + e, "err");
  } finally {
    $("ask").disabled = false;
  }
}

function boot() {
  setTheme(QF.store.get("qf.theme", "light") === "dark" ? "dark" : "light");
  $("theme-light").addEventListener("click", () => setTheme("light"));
  $("theme-dark").addEventListener("click", () => setTheme("dark"));

  $("login-db").addEventListener("change", fillUsers);

  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    showLoginError("");
    const btn = $("login-btn"), pw = $("login-pw");
    btn.disabled = true;
    btn.textContent = "Connecting…";
    const body = JSON.stringify({ database: $("login-db").value, user: $("login-user").value, password: pw.value });
    pw.value = "";  // never keep the password around, success or failure
    try {
      const resp = await fetch("/login", {
        method: "POST", headers: { "Content-Type": "application/json" }, body,
      });
      const s = await resp.json();
      if (!resp.ok) throw new Error(typeof s.detail === "string" ? s.detail : "login failed");
      showApp(s);
    } catch (err) {
      showLoginError(err.message);
      pw.focus();
    } finally {
      btn.disabled = false;
      btn.textContent = "Connect";
    }
  });

  $("logout").addEventListener("click", async () => {
    try { await fetch("/logout", { method: "POST" }); } catch (e) { /* show login regardless */ }
    $("panels").classList.add("hidden");
    $("activity").innerHTML = "";
    showLogin();
  });

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (q) ask(q);
  });

  loadSession();
}

if (typeof document !== "undefined") boot();
if (typeof module !== "undefined") module.exports = QF;
</script>
